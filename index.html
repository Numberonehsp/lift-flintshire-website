<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lift Flintshire CIC delivers inclusive strength, fitness, and wellbeing programmes across Flintshire, North Wales.">
    <title>Lift Flintshire CIC — Community Strength, Fitness &amp; Wellbeing</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Static Netlify form declarations for SPA build detection -->
    <form name="register-couch-to-5k" netlify hidden>
      <input type="text" name="form-name" />
      <input type="text" name="programme" />
      <input type="text" name="first-name" />
      <input type="text" name="last-name" />
      <input type="date" name="date-of-birth" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="emergency-contact-name" />
      <input type="text" name="emergency-contact-relationship" />
      <input type="tel" name="emergency-contact-phone" />
      <input type="radio" name="has-medical-conditions" />
      <textarea name="medical-conditions-details"></textarea>
      <input type="radio" name="has-injuries" />
      <textarea name="injury-details"></textarea>
      <input type="checkbox" name="gdpr-consent" />
      <input type="checkbox" name="photo-consent" />
      <input type="checkbox" name="waiver-agreed" />
      <input type="text" name="waiver-initials" />
    </form>

    <form name="register-womens-run-club" netlify hidden>
      <input type="text" name="form-name" />
      <input type="text" name="programme" />
      <input type="text" name="first-name" />
      <input type="text" name="last-name" />
      <input type="date" name="date-of-birth" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="emergency-contact-name" />
      <input type="text" name="emergency-contact-relationship" />
      <input type="tel" name="emergency-contact-phone" />
      <input type="radio" name="has-medical-conditions" />
      <textarea name="medical-conditions-details"></textarea>
      <input type="radio" name="has-injuries" />
      <textarea name="injury-details"></textarea>
      <input type="checkbox" name="gdpr-consent" />
      <input type="checkbox" name="photo-consent" />
      <input type="checkbox" name="waiver-agreed" />
      <input type="text" name="waiver-initials" />
    </form>

    <form name="programme-questionnaire" netlify hidden>
      <input type="text" name="form-name" />
      <select name="programme"></select>
      <input type="date" name="session-date" />
      <input type="hidden" name="rating-overall" />
      <input type="hidden" name="rating-coaching" />
      <input type="hidden" name="rating-welcome" />
      <input type="hidden" name="rating-venue" />
      <input type="radio" name="would-recommend" />
      <input type="radio" name="wellbeing-impact" />
      <textarea name="what-went-well"></textarea>
      <textarea name="improvements"></textarea>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="checkbox" name="contact-consent" />
    </form>
  </body>
</html>
